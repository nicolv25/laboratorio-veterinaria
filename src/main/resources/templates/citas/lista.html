<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Citas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('citas')}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h2 class="page-title mb-0"><i class="bi bi-calendar-event-fill text-warning me-2"></i>Citas médicas</h2>
        <a th:href="@{/citas/nueva}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Agregar cita</a>
    </div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr><th>Fecha</th><th>Mascota</th><th>Motivo</th><th>Veterinario</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${citas}">
                        <td><span class="badge bg-warning text-dark"><i class="bi bi-calendar3 me-1"></i><span th:text="${c.fecha}">2023-10-25</span></span></td>
                        <td class="fw-semibold" th:text="${c.mascota != null} ? ${c.mascota.nombre} : 'Sin mascota'">Firulais</td>
                        <td th:text="${c.motivo}">Vacunación</td>
                        <td><i class="bi bi-person-badge me-1"></i><span th:text="${c.veterinario}">Dr. Juan</span></td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/citas/{id}/editar(id=${c.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil-square"></i> Editar</a>
                            <form th:action="@{/citas/{id}/eliminar(id=${c.id})}" method="post" class="d-inline"
                                  data-msg="¿Eliminar esta cita? También se eliminarán sus tratamientos."
                                  onsubmit="return confirm(this.dataset.msg)">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(citas)}">
                        <td colspan="5" class="text-center text-muted py-4"><i class="bi bi-inbox fs-3 d-block"></i>No hay citas registradas.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
