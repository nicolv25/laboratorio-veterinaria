<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cita')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('citas')}"></nav>
<main class="container py-4" style="max-width: 720px;">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="card">
        <div class="card-body p-4">
            <h3 class="page-title mb-4">
                <i class="bi bi-calendar-event-fill text-warning me-2"></i>
                <span th:text="${cita.id == null} ? 'Nueva cita' : 'Editar cita'">Nueva cita</span>
            </h3>
            <form th:action="@{/citas/guardar}" th:object="${cita}" method="post" class="row g-3">
                <input type="hidden" th:field="*{id}">
                <div class="col-12 col-md-6">
                    <label class="form-label">Fecha</label>
                    <input type="date" class="form-control" name="fecha" th:value="${cita.fecha}" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label">Veterinario</label>
                    <input type="text" class="form-control" th:field="*{veterinario}" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Mascota</label>
                    <select class="form-select" name="mascota.id" required>
                        <option value="">-- Selecciona una mascota --</option>
                        <option th:each="m : ${mascotas}" th:value="${m.id}"
                                th:text="${m.nombre} + (${m.dueno != null} ? ' (' + ${m.dueno.nombre} + ')' : '')"
                                th:selected="${cita.mascota != null and cita.mascota.id == m.id}">Firulais</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Motivo de la consulta</label>
                    <textarea class="form-control" rows="3" th:field="*{motivo}" required></textarea>
                </div>
                <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/citas}" class="btn btn-outline-secondary"><i class="bi bi-x-circle me-1"></i>Cancelar</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Guardar</button>
                </div>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
