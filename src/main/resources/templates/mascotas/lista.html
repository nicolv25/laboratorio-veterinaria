<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mascotas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('mascotas')}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h2 class="page-title mb-0"><i class="bi bi-emoji-smile-fill text-primary me-2"></i>Mascotas</h2>
        <a th:href="@{/mascotas/nueva}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Agregar mascota</a>
    </div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nombre</th><th>Especie</th><th>Raza</th><th>Edad</th><th>Dueño</th><th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="m : ${mascotas}">
                        <td class="fw-semibold" th:text="${m.nombre}">Firulais</td>
                        <td><span class="badge bg-info text-dark" th:text="${m.especie}">Perro</span></td>
                        <td th:text="${m.raza}">Labrador</td>
                        <td><span class="badge bg-secondary" th:text="${m.edad} + ' años'">3 años</span></td>
                        <td><i class="bi bi-person me-1"></i><span th:text="${m.dueno != null} ? ${m.dueno.nombre} : 'Sin dueño'">Carlos</span></td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/mascotas/{id}/editar(id=${m.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil-square"></i> Editar</a>
                            <form th:action="@{/mascotas/{id}/eliminar(id=${m.id})}" method="post" class="d-inline"
                                  th:data-msg="'¿Eliminar a ' + ${m.nombre} + '? También se eliminarán sus citas y tratamientos.'"
                                  onsubmit="return confirm(this.dataset.msg)">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(mascotas)}">
                        <td colspan="6" class="text-center text-muted py-4"><i class="bi bi-inbox fs-3 d-block"></i>No hay mascotas registradas.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
