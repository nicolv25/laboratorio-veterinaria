<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Clínica Veterinaria'">Clínica Veterinaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-heart-pulse-fill me-1"></i> VetClinic</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto gap-lg-1">
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'inicio'} ? 'active'" th:href="@{/}"><i class="bi bi-house-door-fill me-1"></i>Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'mascotas'} ? 'active'" th:href="@{/mascotas}"><i class="bi bi-emoji-smile-fill me-1"></i>Mascotas</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'duenos'} ? 'active'" th:href="@{/duenos}"><i class="bi bi-person-fill me-1"></i>Dueños</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'citas'} ? 'active'" th:href="@{/citas}"><i class="bi bi-calendar-event-fill me-1"></i>Citas</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${active == 'tratamientos'} ? 'active'" th:href="@{/tratamientos}"><i class="bi bi-capsule me-1"></i>Tratamientos</a></li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="alerts">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="footer" class="text-center text-muted small py-4">
    Sistema de Gestión Veterinaria · Desarrollo de Software III
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
