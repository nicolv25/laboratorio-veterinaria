<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tratamientos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('tratamientos')}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h2 class="page-title mb-0"><i class="bi bi-capsule text-danger me-2"></i>Tratamientos</h2>
        <a th:href="@{/tratamientos/nuevo}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Agregar tratamiento</a>
    </div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr><th>Descripción</th><th>Dosis</th><th>Cita</th><th>Mascota</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${tratamientos}">
                        <td class="fw-semibold" th:text="${t.descripcion}">Vacuna Rabia</td>
                        <td><span class="badge bg-danger-subtle text-danger" th:text="${t.dosis}">1 dosis</span></td>
                        <td>
                            <span th:if="${t.cita != null}" class="badge bg-warning text-dark">
                                <i class="bi bi-calendar3 me-1"></i><span th:text="${t.cita.fecha} + ' · ' + ${t.cita.motivo}">2023-10-25</span>
                            </span>
                        </td>
                        <td th:text="${t.cita != null and t.cita.mascota != null} ? ${t.cita.mascota.nombre} : '-'">Firulais</td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/tratamientos/{id}/editar(id=${t.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil-square"></i> Editar</a>
                            <form th:action="@{/tratamientos/{id}/eliminar(id=${t.id})}" method="post" class="d-inline"
                                  th:data-msg="'¿Eliminar el tratamiento ' + ${t.descripcion} + '?'"
                                  onsubmit="return confirm(this.dataset.msg)">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tratamientos)}">
                        <td colspan="5" class="text-center text-muted py-4"><i class="bi bi-inbox fs-3 d-block"></i>No hay tratamientos registrados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
