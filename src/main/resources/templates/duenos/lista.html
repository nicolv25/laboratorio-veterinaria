<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dueños')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('duenos')}"></nav>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h2 class="page-title mb-0"><i class="bi bi-person-fill text-success me-2"></i>Dueños</h2>
        <a th:href="@{/duenos/nuevo}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Agregar dueño</a>
    </div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Dirección</th><th class="text-end">Acciones</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${duenos}">
                        <td class="fw-semibold" th:text="${d.nombre}">Carlos Perez</td>
                        <td><i class="bi bi-telephone me-1"></i><span th:text="${d.telefono}">300</span></td>
                        <td><i class="bi bi-envelope me-1"></i><span th:text="${d.correo}">mail</span></td>
                        <td th:text="${d.direccion}">Calle 1</td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/duenos/{id}/editar(id=${d.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil-square"></i> Editar</a>
                            <form th:action="@{/duenos/{id}/eliminar(id=${d.id})}" method="post" class="d-inline"
                                  th:data-msg="'¿Eliminar a ' + ${d.nombre} + '? También se eliminarán sus mascotas, citas y tratamientos.'"
                                  onsubmit="return confirm(this.dataset.msg)">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(duenos)}">
                        <td colspan="5" class="text-center text-muted py-4"><i class="bi bi-inbox fs-3 d-block"></i>No hay dueños registrados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
